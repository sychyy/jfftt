<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamus Kanji | JFT Basic</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--ink:#181818;--paper:#fffdf8;--yellow:#ffe45c;--blue:#62bddb;--teal:#43c9bd}*{box-sizing:border-box}body{font-family:Inter,sans-serif;background-color:#f7f4e9;background-image:radial-gradient(#ded9cc .8px,transparent .8px);background-size:13px 13px;color:#263348}.jp{font-family:"Noto Sans JP",sans-serif}.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink)}.retro{border:3px solid var(--ink);border-radius:13px;box-shadow:3px 3px 0 var(--ink);font-weight:800}.entry{border:2px solid var(--ink);border-radius:14px;padding:14px;background:#fffdf8;box-shadow:3px 3px 0 var(--ink)}</style>
<link rel="stylesheet" href="assets/css/pixel-pastel-theme.css?v=20261017-world">
<script src="assets/js/ui/pixel-nav.js?v=20261017-world" defer></script>
  <link rel="stylesheet" href="assets/css/pixel-world-redesign.css?v=20261017-world">
</head><body><header class="sticky top-0 z-10 border-b-[3px] border-black bg-[#fffdf8]/95"><div class="max-w-4xl mx-auto p-4 flex justify-between items-center"><a href="flashcards.html" class="font-black">← Kembali ke Flashcard</a><span class="retro bg-[#ffe45c] px-3 py-2 text-xs">KAMUS KANJI</span></div></header><main class="max-w-4xl mx-auto p-4 py-7 space-y-5"><section class="panel p-5 sm:p-7"><div class="jp text-4xl text-center">漢字辞書</div><h1 class="text-2xl font-black text-center mt-2">Kamus Kanji</h1><p class="text-center text-slate-500 mt-2">Cari semua kosakata, lalu lihat kanji, hiragana, romaji, arti, dan babnya.</p><input id="search" class="w-full border-[3px] border-black rounded-xl p-3 mt-5" placeholder="Cari kanji, hiragana, romaji, atau arti…"><div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3"><select id="category" class="retro p-3 bg-white"><option value="all">Semua kategori</option><option value="verb">Kata kerja</option><option value="adj">Kata sifat</option><option value="person">Orang & keluarga</option><option value="time">Waktu & angka</option><option value="place">Tempat</option><option value="food">Makanan & minuman</option><option value="other">Lainnya</option></select><select id="chapter" class="retro p-3 bg-white"><option value="all">Semua bab</option></select><select id="level" class="retro p-3 bg-white"><option value="all">N5 + N4</option><option value="n5">N5 · Bab 1–25</option><option value="n4">N4 · Bab 26–50</option></select></div><p id="count" class="text-sm font-bold text-slate-500 mt-4">Memuat kamus…</p></section><section id="results" class="grid sm:grid-cols-2 gap-4"></section><button id="more" class="retro bg-[#ffe45c] w-full p-3">Muat lebih banyak</button></main><script>
let bank=[],shown=0;const $=id=>document.getElementById(id);const clean=s=>String(s||'').toLowerCase().normalize('NFKC');function kanaToRomaji(input){let h=String(input||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));const m={'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o','ん':'n','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ー':'-',' ':' '};let out='';for(const c of h)out+=m[c]??'';return out}function category(q){const m=clean(q.meaning),k=String(q.kana||'');if(/ます|ました|ません|てください/.test(k)||/^(pergi|datang|makan|minum|membaca|menulis|bekerja|belajar|membeli|membuat|melihat|mendengar|pulang|berangkat)/.test(m))return'verb';if(/い$/.test(k)||/な）|な\)/.test(k)||/(besar|kecil|bagus|baik|buruk|panas|dingin|lemah|kuat|cepat|lambat|mudah|sulit|mahal|murah|tinggi|rendah|panjang|pendek)/.test(m))return'adj';if(/orang|ayah|ibu|anak|teman|guru|keluarga|saudara|kakak|adik/.test(m))return'person';if(/hari|waktu|jam|menit|bulan|tahun|angka|nomor|pagi|siang|malam/.test(m))return'time';if(/rumah|sekolah|kantor|tempat|kota|toko|restoran|stasiun|pabrik|perusahaan/.test(m))return'place';if(/makan|minum|ikan|daging|sayur|buah|nasi|air|kopi|teh|roti/.test(m))return'food';return'other'}function render(reset=false){if(reset){shown=0;$('results').innerHTML=''}const q=clean($('search').value),cat=$('category').value,ch=$('chapter').value,lvl=$('level').value;let rows=bank.filter(x=>(lvl==='all'||(lvl==='n5'?x.chapter<=25:x.chapter>=26))&&(ch==='all'||String(x.chapter)===ch)&&(cat==='all'||category(x)===cat)&&[x.kanji,x.kana,x.meaning,kanaToRomaji(x.kana)].some(v=>clean(v).includes(q)));$('count').textContent=`${rows.length.toLocaleString('id-ID')} kosakata ditemukan`;const batch=rows.slice(shown,shown+80);batch.forEach(x=>{const card=document.createElement('article');card.className='entry';card.innerHTML=`<div class="jp text-4xl font-black">${x.kanji}</div><div class="jp mt-2 font-bold">${x.kana}</div><div class="text-sm text-slate-500">${kanaToRomaji(x.kana)}</div><div class="font-bold mt-2">${x.meaning}</div><div class="text-xs text-slate-400 mt-3">Bab ${x.chapter} · ${category(x)}</div>`;$('results').appendChild(card)});shown+=batch.length;$('more').classList.toggle('hidden',shown>=rows.length||rows.length===0)}fetch('data/kanji-bank.json').then(r=>r.json()).then(d=>{bank=d;for(let i=1;i<=50;i++){const o=document.createElement('option');o.value=i;o.textContent=`Bab ${i}`;$('chapter').append(o)}render(true)}).catch(()=>$('count').textContent='Bank kosakata tidak dapat dimuat.');['search','category','chapter','level'].forEach(id=>$(id).addEventListener('input',()=>render(true)));$('more').onclick=()=>render(false);
</script></body></html>
