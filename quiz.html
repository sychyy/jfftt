<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JFT-Basic — Latihan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="min-h-screen flex flex-col" data-page="quiz">
<header class="bg-white shadow-sm sticky top-0 z-50" id="main-header">
<div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
<i class="fa-solid fa-language text-brand-600 text-2xl"></i>
<div>
<h1 class="text-lg font-bold text-slate-800 leading-tight">JFT-Basic Practice</h1>
<p class="text-xs text-slate-500 hidden sm:block">Simulasi Latihan Bahasa Jepang</p>
</div>
</div>
<nav class="flex items-center gap-4">
<button class="text-slate-600 hover:text-brand-600 transition font-medium text-sm flex items-center gap-1" onclick="navigate('history')">
<i class="fa-solid fa-clock-rotate-left"></i> Riwayat
                </button>
<button class="text-red-500 hover:text-red-600 transition font-medium text-sm flex items-center gap-1" onclick="handleLogout()">
<i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
</nav>
</div>
</header>
<main class="flex-grow flex flex-col items-center p-4 max-w-4xl mx-auto w-full">
<div class="screen active w-full mt-4" id="screen-quiz">
<div class="bg-white p-4 rounded-t-2xl border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
<div class="flex items-center gap-3 w-full sm:w-auto">
<span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-semibold japanese-text" id="quiz-section-badge">文字と語彙</span>
<span class="text-sm font-medium text-slate-600" id="quiz-progress-text">Soal 1 / 20</span>
</div>
<div class="w-full sm:w-1/2 h-2 bg-slate-100 rounded-full overflow-hidden">
<div class="h-full bg-brand-500 transition-all duration-300" id="quiz-progress-bar" style="width: 5%"></div>
</div>
<div class="text-slate-600 font-mono font-medium flex items-center gap-2 w-full sm:w-auto justify-end" id="quiz-timer">
<i class="fa-regular fa-clock"></i> <span>00:00</span>
</div>
</div>
<div class="bg-white p-6 sm:p-8 rounded-b-2xl shadow-sm border border-t-0 border-slate-100 min-h-[400px] flex flex-col">
<div class="mb-6">
<p class="text-sm text-slate-500 mb-2 japanese-text" id="quiz-instruction">つぎの ぶんの （　　　）に なにを いれますか。</p>
<button class="hidden mb-4 bg-brand-100 hover:bg-brand-200 text-brand-700 py-2 px-4 rounded-lg flex items-center gap-2 transition font-medium" id="btn-play-audio" onclick="playQuestionAudio()">
<i class="fa-solid fa-volume-high"></i> Putar Audio
                    </button>
<button class="hidden mb-4 text-sm text-slate-500 hover:text-brand-600 underline transition" id="btn-show-transcript" onclick="showTranscript()">
</button>
<div class="hidden mb-4 p-4 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 japanese-text whitespace-pre-wrap text-sm leading-relaxed" id="audio-transcript-fallback"></div>
<h3 class="text-xl sm:text-2xl font-medium text-slate-800 japanese-text leading-relaxed whitespace-pre-wrap" id="quiz-question"></h3>
</div>
<div class="flex-grow flex flex-col gap-3" id="quiz-options"></div>
<div class="mt-8 flex justify-between gap-3">
<button class="bg-slate-200 text-slate-700 font-medium py-2.5 px-6 rounded-lg transition-colors flex items-center gap-2 border-2 border-slate-700 shadow-[3px_3px_0_#1f2937] opacity-50 cursor-not-allowed" disabled="" id="btn-prev-question" onclick="previousQuestion()">
<i class="fa-solid fa-angle-left"></i>
        Kembali
    </button>
<button class="bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors flex items-center gap-2 border-2 border-slate-700 shadow-[3px_3px_0_#1f2937] opacity-50 cursor-not-allowed" disabled="" id="btn-next-question" onclick="nextQuestion()">
        Selanjutnya
        <i class="fa-solid fa-angle-right"></i>
</button>
</div>
</div>
<button class="mt-4 text-slate-400 hover:text-red-500 text-sm transition flex items-center gap-1 mx-auto" onclick="confirmQuit()">
<i class="fa-solid fa-xmark"></i> Akhiri latihan lebih awal
            </button>
</div>
</main>
<div class="fixed inset-0 z-[5000] hidden items-center justify-center bg-black/40 backdrop-blur-sm px-4" id="custom-confirm-modal" style="z-index:5000 !important;">
<div class="bg-[#fffdf8] p-6 rounded-2xl border-[3px] border-[#181818] shadow-[8px_8px_0_#181818] max-w-sm w-full transform transition-all scale-95 opacity-0" id="custom-confirm-box">
<h3 class="text-xl font-black text-[#181818] mb-2 flex items-center gap-2">
<i class="fa-solid fa-triangle-exclamation text-[#ff7373]"></i> Konfirmasi
                </h3>
<p class="text-slate-700 font-medium mb-6" id="custom-confirm-msg">Pesan di sini</p>
<div class="flex justify-end gap-3">
<button class="px-4 py-2 bg-[#f0ede5] text-[#181818] border-[2px] border-[#181818] rounded-xl text-sm font-bold shadow-[3px_3px_0_#181818] hover:-translate-y-1 hover:shadow-[5px_5px_0_#181818] transition-all" onclick="hideCustomConfirm()">Batal</button>
<button class="px-4 py-2 bg-[#ff7373] text-[#181818] border-[2px] border-[#181818] rounded-xl text-sm font-bold shadow-[3px_3px_0_#181818] hover:-translate-y-1 hover:shadow-[5px_5px_0_#181818] transition-all" id="btn-confirm-ok">Ya</button>
</div>
</div>
</div>
<script src="assets/js/app-legacy.js"></script>
<script src="assets/js/resume-router.js"></script>
<script src="assets/js/chat-media.js"></script>
<script src="assets/js/chat-enhancements.js"></script>
</body>
</html>
