<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Note & Renshuu — JFT-Basic</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/app.css"><style>body{background:#f4f6f8}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:18px}.jp{font-family:system-ui,sans-serif}.btn{border:2px solid #181818;border-radius:12px;padding:10px 14px;font-weight:800}.primary{background:#ffe45c}.choice{display:block;width:100%;text-align:left;border:2px solid #e5e7eb;border-radius:12px;padding:13px;margin-top:9px;font-weight:700}.choice.selected{border-color:#181818;background:#fff2a8}</style></head><body class="text-slate-900"><main class="max-w-3xl mx-auto p-4 sm:p-6"><header class="flex items-center justify-between gap-3 mb-5"><div><div class="text-xs font-black tracking-widest text-slate-400">JFT-BASIC</div><h1 class="text-2xl font-black">Note & Renshuu</h1><p class="text-sm text-slate-500">Simpan kanji dan kotoba, lalu latihan untuk mengetahui bagian yang perlu diulang.</p></div><a class="btn" href="home.html">Menu</a></header>
<section class="card mb-4"><h2 class="text-lg font-black">Tambah catatan</h2><div class="grid sm:grid-cols-2 gap-3 mt-4"><label class="text-sm font-bold">Jenis catatan<select id="kind" class="block w-full mt-1 border rounded-xl p-3"><option value="kanji">Kanji</option><option value="kotoba">Kotoba / kosakata</option></select></label><label class="text-sm font-bold">Pilih dari database<select id="bankPick" class="block w-full mt-1 border rounded-xl p-3"><option value="">Memuat database...</option></select></label><label class="text-sm font-bold">Kanji / kata Jepang<input id="word" class="block w-full mt-1 border rounded-xl p-3" placeholder="Contoh: 心配します"></label><label class="text-sm font-bold">Hiragana / kana<input id="kana" class="block w-full mt-1 border rounded-xl p-3" placeholder="Contoh: しんぱいします"></label><label class="text-sm font-bold">Romaji<input id="romaji" class="block w-full mt-1 border rounded-xl p-3" placeholder="Contoh: shinpai shimasu"></label><label class="text-sm font-bold">Arti Indonesia<input id="meaning" class="block w-full mt-1 border rounded-xl p-3" placeholder="Contoh: khawatir"></label><label class="text-sm font-bold sm:col-span-2">Catatan tambahan<textarea id="memo" class="block w-full mt-1 border rounded-xl p-3" rows="2" placeholder="Contoh kalimat, cara mengingat, atau catatan"></textarea></label></div><div class="flex flex-wrap gap-2 mt-4"><button id="save" class="btn primary">Simpan ke Note</button><button id="clear" class="btn">Kosongkan</button></div><p id="msg" class="text-sm text-slate-500 mt-3"></p></section>
<section class="card mb-4"><div class="flex items-center justify-between gap-3"><div><h2 class="text-lg font-black">Catatan saya</h2><p id="summary" class="text-sm text-slate-500">0 item</p></div><button id="start" class="btn primary">Mulai Renshuu</button></div><div id="notes" class="mt-4 space-y-3"></div></section>
<section id="practice" class="card mb-4 hidden"><div class="flex justify-between items-center"><h2 class="text-lg font-black">Renshuu</h2><span id="progress" class="text-sm font-bold"></span></div><p id="prompt" class="text-sm text-slate-500 mt-3"></p><div id="question" class="jp text-4xl font-black text-center py-6"></div><div id="choices"></div><p id="feedback" class="text-sm font-bold mt-3"></p><button id="next" class="btn primary mt-4" disabled>Soal berikutnya</button></section>
<section class="card"><h2 class="text-lg font-black">Monitoring kekurangan</h2><p class="text-sm text-slate-500 mt-1">Item yang sering salah akan ditandai sebagai prioritas latihan. Data tersimpan di browser perangkat ini.</p><div id="weak" class="mt-3 space-y-2"></div></section></main>
<script>
const $=id=>document.getElementById(id),KEY='jft_personal_notes_v1';let bank=[],notes=[],session=[],idx=0,selected=null,answered=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function loadNotes(){try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}}
function saveNotes(){localStorage.setItem(KEY,JSON.stringify(notes));renderNotes()}
async function init(){loadNotes();try{const r=await fetch('data/kanji-bank.json');if(!r.ok)throw Error();bank=(await r.json()).filter(x=>x.kanji&&x.kana&&x.meaning);$('bankPick').innerHTML='<option value="">Pilih item database (opsional)</option>'+bank.map((x,i)=>`<option value="${i}">${esc(x.kanji)} — ${esc(x.kana)} (${esc(x.meaning)})</option>`).join('')}catch{$('bankPick').innerHTML='<option value="">Database tidak tersedia — isi manual</option>'}renderNotes()}
$('bankPick').onchange=()=>{const q=bank[Number($('bankPick').value)];if(!q)return;$('kind').value='kanji';$('word').value=q.kanji||'';$('kana').value=q.kana||'';$('romaji').value=q.romaji||'';$('meaning').value=q.meaning||'';$('memo').value=q.chapter?`Dari database • Bab ${q.chapter}`:''};
$('clear').onclick=()=>['word','kana','romaji','meaning','memo'].forEach(id=>$(id).value='');
$('save').onclick=()=>{const word=$('word').value.trim(),kana=$('kana').value.trim(),meaning=$('meaning').value.trim();if(!word||!meaning){$('msg').textContent='Isi kata Jepang dan arti Indonesia terlebih dahulu.';return}const id=crypto.randomUUID?crypto.randomUUID():String(Date.now());notes.unshift({id,kind:$('kind').value,word,kana,romaji:$('romaji').value.trim(),meaning,memo:$('memo').value.trim(),correct:0,wrong:0,createdAt:Date.now()});saveNotes();$('msg').textContent='Catatan berhasil disimpan.';$('clear').click()};
function renderNotes(){$('summary').textContent=`${notes.length} item tersimpan`;const root=$('notes');root.innerHTML=notes.length?notes.map(n=>`<article class="border rounded-xl p-3"><div class="flex justify-between gap-3"><div><span class="text-xs uppercase font-black text-slate-400">${n.kind==='kanji'?'KANJI':'KOTOBA'}</span><div class="jp text-2xl font-black">${esc(n.word)}</div><div class="text-sm text-slate-500">${esc(n.kana)} ${n.romaji?'· '+esc(n.romaji):''}</div><div class="font-bold mt-1">${esc(n.meaning)}</div>${n.memo?`<p class="text-sm text-slate-500 mt-1">${esc(n.memo)}</p>`:''}<p class="text-xs text-slate-400 mt-2">Benar ${n.correct||0} • Salah ${n.wrong||0}</p></div><button class="text-red-600 text-sm font-bold" onclick="removeNote('${esc(n.id)}')">Hapus</button></div></article>`).join(''):'<p class="text-sm text-slate-400">Belum ada catatan. Tambahkan kanji atau kotoba di atas.</p>';const weak=[...notes].sort((a,b)=>(b.wrong||0)-(a.wrong||0));$('weak').innerHTML=weak.length?weak.slice(0,8).map(n=>`<div class="flex justify-between gap-3 border rounded-lg p-3"><div><b class="jp">${esc(n.word)}</b> <span class="text-sm text-slate-500">${esc(n.meaning)}</span></div><span class="text-sm font-black ${(n.wrong||0)>=(n.correct||0)?'text-red-600':'text-emerald-700'}">${(n.wrong||0)>=(n.correct||0)?'Perlu diulang':'Cukup baik'} · ${n.wrong||0} salah</span></div>`).join(''):'<p class="text-sm text-slate-400">Belum ada data. Kerjakan Renshuu untuk mulai memantau.</p>'}
function removeNote(id){notes=notes.filter(n=>n.id!==id);saveNotes()}
function shuffle(a){return a.sort(()=>Math.random()-.5)}function norm(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}]/gu,'')}
$('start').onclick=()=>{if(!notes.length){$('msg').textContent='Tambahkan minimal satu catatan untuk mulai latihan.';return}session=shuffle([...notes]).slice(0,Math.min(10,notes.length));idx=0;$('practice').classList.remove('hidden');renderPractice();$('practice').scrollIntoView({behavior:'smooth'})};
function renderPractice(){const n=session[idx];selected=null;answered=false;$('progress').textContent=`${idx+1}/${session.length}`;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=idx===session.length-1?'Selesai':'Soal berikutnya';const mode=['meaning','kana','romaji'][Math.floor(Math.random()*3)];n._mode=mode;$('prompt').textContent=mode==='meaning'?'Pilih arti bahasa Indonesia yang tepat.':mode==='kana'?'Pilih hiragana/kana yang tepat.':'Pilih romaji yang tepat.';$('question').textContent=mode==='meaning'?n.word:mode==='kana'?(n.meaning):n.meaning;let answer=mode==='meaning'?n.meaning:mode==='kana'?(n.kana||n.romaji||n.word):(n.romaji||n.kana||n.word);let pool=notes.filter(x=>x.id!==n.id).map(x=>mode==='meaning'?x.meaning:mode==='kana'?(x.kana||x.romaji||x.word):(x.romaji||x.kana||x.word)).filter(x=>x&&norm(x)!==norm(answer));let opts=shuffle([answer,...shuffle([...new Set(pool)]).slice(0,3)]);while(opts.length<4)opts.push(['Kata lain','Tidak diketahui','Pilihan lain'][opts.length-1]);opts=shuffle([...new Set(opts)]).slice(0,4);if(!opts.includes(answer))opts[0]=answer;$('choices').innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>choose(o,answer,n);$('choices').appendChild(b)})}
function choose(o,answer,n){if(answered)return;answered=true;selected=o;const ok=norm(o)===norm(answer);n[ok?'correct':'wrong']=(n[ok?'correct':'wrong']||0)+1;saveNotes();[...$('choices').children].forEach(b=>{b.disabled=true;if(norm(b.textContent)===norm(answer))b.classList.add('selected')});$('feedback').textContent=ok?'Benar! Bagus.':`Belum tepat. Jawaban: ${answer}`;$('feedback').className='text-sm font-bold mt-3 '+(ok?'text-emerald-700':'text-red-600');$('next').disabled=false}
$('next').onclick=()=>{if(!answered)return;if(idx<session.length-1){idx++;renderPractice()}else{$('question').textContent='Renshuu selesai!';$('prompt').textContent='Hasil latihan sudah diperbarui ke monitoring.';$('choices').innerHTML='';$('feedback').textContent='Kamu bisa mulai latihan lagi kapan saja.';$('next').disabled=true;session=[];renderNotes()}};
init();
</script></body></html>
