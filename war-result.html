<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JFT-Basic — War Result</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="assets/js/tailwind-config.js"></script><link rel="stylesheet" href="assets/css/app.css"></head><body class="min-h-screen"><main class="max-w-5xl mx-auto p-4 sm:p-6"><div class="flex justify-between items-center mb-5"><div class="font-black text-lg"><i class="fa-solid fa-bolt text-brand-600 mr-2"></i>JFT-Basic WAR</div><span id="roomCode" class="text-xs font-black tracking-widest bg-slate-100 px-3 py-1.5 rounded-full"></span></div><div class="grid lg:grid-cols-[330px_1fr] gap-4"><section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 text-center"><div id="rank" class="text-6xl font-black">-</div><div class="text-xs font-black text-slate-400 uppercase mt-2">Rank War</div><div id="score" class="text-4xl font-black mt-5">0 / 250</div><div id="detail" class="text-sm text-slate-500 mt-2"></div><div class="mt-5 p-4 rounded-xl bg-slate-50 text-left"><div class="text-[10px] font-black uppercase text-slate-400">War Point</div><div class="flex items-end gap-2"><b id="earned" class="text-2xl font-black">+0</b><span class="text-xs text-slate-500">point</span></div><div class="text-xs text-slate-500 mt-1">Total War Point: <b id="totalPoints">0</b></div></div><div class="grid gap-2 mt-5"><button onclick="location.href='war.html'" class="py-3 rounded-xl border-2 border-slate-900 font-black">Kembali ke Room</button><button onclick="location.href='home.html'" class="py-3 rounded-xl bg-slate-900 text-white font-black">Selesai — Menu</button></div></section><section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5"><div class="flex justify-between items-center"><div><h1 class="text-xl font-black">Leaderboard War</h1><p class="text-xs text-slate-400 mt-1">Urutan berdasarkan Score War, bukan waktu tercepat.</p></div><span id="status" class="text-[10px] font-black text-emerald-600">LIVE</span></div><div id="leaderboard" class="mt-4 space-y-2"></div></section></div></main><script>
const sb=window.supabase.createClient('https://lnthciiomeppirzucqwu.supabase.co','sb_publishable_1TYGD_KXkkxJEiFug566zQ_CjZfmUN-');let session,result,room,channel;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;const rank=s=>s===250?'S':s>=200?'A':s>=150?'B':s>=100?'C':'D';
async function init(){try{session=JSON.parse(sessionStorage.getItem('jft_war_session')||'null');result=JSON.parse(sessionStorage.getItem('jft_war_result')||'null')}catch{}if(!session||!result){location.href='war.html';return}const {data}=await sb.from('jft_war_rooms').select('*').eq('id',session.roomId).single();room=data;if(!room){location.href='war.html';return}document.getElementById('roomCode').textContent=room.code;document.getElementById('rank').textContent=result.rank;document.getElementById('score').textContent=`${result.score} / 250`;document.getElementById('detail').textContent=`${result.correct}/${result.total} benar • ${fmt(result.elapsed)}`;document.getElementById('earned').textContent='+'+result.warPoints;document.getElementById('totalPoints').textContent=result.totalPoints;subscribe();render()}
function subscribe(){channel=sb.channel('jft-war-result-'+room.id+'-'+session.playerId);channel.on('postgres_changes',{event:'*',schema:'public',table:'jft_war_players',filter:'room_id=eq.'+room.id},render).subscribe()}
async function render(){const {data}=await sb.from('jft_war_players').select('*').eq('room_id',room.id).order('score',{ascending:false}).order('elapsed_seconds',{ascending:true});const el=document.getElementById('leaderboard');el.innerHTML=(data||[]).map((p,i)=>`<div class="flex items-center gap-3 p-3 rounded-xl border ${p.id===session.playerId?'border-slate-900 shadow-[3px_3px_0_#181818]':'border-slate-200'}"><div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-black">${i+1}</div><div class="flex-1 min-w-0"><div class="font-black truncate">${esc(p.player_name)} ${p.id===session.playerId?'<span class="text-[9px] text-slate-400">(KAMU)</span>':''}</div><div class="text-[10px] text-slate-500">${p.status==='finished'?'Selesai':'Masih mengerjakan'} • ${p.current_question||0}/${room.question_count} soal • ${fmt(p.elapsed_seconds||0)}</div></div><div class="text-right"><b class="text-lg">${p.score||0}</b><div class="text-[10px] font-black">Rank ${rank(Number(p.score||0))}</div></div></div>`).join('')||'<div class="text-sm text-slate-400">Belum ada pemain.</div>'}
init();
</script></body></html>
