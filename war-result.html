<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JFT-Basic — War Result</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="assets/js/ui/tailwind-config.js"></script><link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/page-loader.css"><script src="assets/js/ui/page-loader.js" defer></script>
</head><body class="min-h-screen">
<div id="jft-page-loader" aria-hidden="false" role="status" aria-label="Memuat halaman">
  <div class="jft-loader-bars" aria-hidden="true">
    <span class="jft-loader-bar"></span>
    <span class="jft-loader-bar"></span>
    <span class="jft-loader-bar"></span>
  </div>
</div>
<main class="max-w-5xl mx-auto p-4 sm:p-6"><div class="flex justify-between items-center mb-5"><div class="font-black text-lg"><i class="fa-solid fa-bolt text-brand-600 mr-2"></i>JFT-Basic WAR</div><span id="roomCode" class="text-xs font-black tracking-widest bg-slate-100 px-3 py-1.5 rounded-full"></span></div><div class="grid lg:grid-cols-[330px_1fr] gap-4"><section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 text-center"><div id="rank" class="text-6xl font-black">-</div><div class="text-xs font-black text-slate-400 uppercase mt-2">Rank War</div><div id="score" class="text-4xl font-black mt-5">0 / 250</div><div id="detail" class="text-sm text-slate-500 mt-2"></div><div class="mt-5 p-4 rounded-xl bg-slate-50 text-left"><div class="text-[10px] font-black uppercase text-slate-400">War Point</div><div class="flex items-end gap-2"><b id="earned" class="text-2xl font-black">+0</b><span class="text-xs text-slate-500">point</span></div><div class="text-xs text-slate-500 mt-1">Total War Point: <b id="totalPoints">0</b></div></div><div class="grid gap-2 mt-5"><button onclick="location.href='war.html'" class="py-3 rounded-xl border-2 border-slate-900 font-black">Kembali ke Room</button><button onclick="location.href='home.html'" class="py-3 rounded-xl bg-slate-900 text-white font-black">Selesai — Menu</button></div></section><section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5"><div class="flex justify-between items-center"><div><h1 class="text-xl font-black">Leaderboard War</h1><p class="text-xs text-slate-400 mt-1">Urutan berdasarkan Score War, bukan waktu tercepat.</p></div><span id="status" class="text-[10px] font-black text-emerald-600">LIVE</span></div><div id="leaderboard" class="mt-4 space-y-2"></div></section></div><section id="teamReview" class="hidden mt-5 bg-white rounded-2xl border-2 border-slate-900 p-5"><h2 class="text-xl font-black">Koreksi Semua Pemain</h2><p id="teamReviewNotice" class="text-sm text-slate-500 mt-1"></p><div id="teamReviewPlayers" class="flex flex-wrap gap-2 mt-4"></div><div id="teamReviewList" class="space-y-3 mt-4"></div></section><section id="warReview" class="hidden mt-5 bg-white rounded-2xl border-2 border-slate-900 shadow-[5px_5px_0_#181818] p-5"><h2 id="warReviewTitle" class="text-xl font-black">Koreksi Jawaban</h2><p id="warReviewSummary" class="text-sm text-slate-500 mt-1"></p><div class="flex flex-wrap gap-2 mt-4"><button id="warShowAll" class="rounded-lg border-2 border-slate-900 bg-slate-900 text-white px-4 py-2 text-sm font-black">Semua</button><button id="warShowCorrect" class="rounded-lg border-2 border-emerald-600 px-4 py-2 text-sm font-black text-emerald-700">Benar (0)</button><button id="warShowWrong" class="rounded-lg border-2 border-red-600 px-4 py-2 text-sm font-black text-red-700">Salah (0)</button></div><div id="warReviewList" class="space-y-3 mt-4"></div></section></main><script>
const sb=window.supabase.createClient('https://lnthciiomeppirzucqwu.supabase.co','sb_publishable_1TYGD_KXkkxJEiFug566zQ_CjZfmUN-');let session,result,room,channel;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;const rank=s=>s===250?'S':s>=200?'A':s>=150?'B':s>=100?'C':'D';
async function init(){try{session=JSON.parse(sessionStorage.getItem('jft_war_session')||'null');result=JSON.parse(sessionStorage.getItem('jft_war_result')||'null')}catch{}if(!session||!result){location.href='war.html';return}const {data}=await sb.from('jft_war_rooms').select('*').eq('id',session.roomId).single();room=data;if(!room){location.href='war.html';return}document.getElementById('roomCode').textContent=room.code;document.getElementById('rank').textContent=result.rank;document.getElementById('score').textContent=`${result.score} / 250`;document.getElementById('detail').textContent=`${result.correct}/${result.total} benar • ${fmt(result.elapsed)}`;document.getElementById('earned').textContent='+'+result.warPoints;document.getElementById('totalPoints').textContent=result.totalPoints;renderWarReview();subscribe();render()}
function renderWarReview(){
 let data;try{data=JSON.parse(sessionStorage.getItem('jft_war_review')||'null')}catch{}if(!data){try{data=JSON.parse(sessionStorage.getItem('jft_war_kanji_review')||'null')}catch{}}
 if(!data)return;
 const section=document.getElementById('warReview'),summary=document.getElementById('warReviewSummary'),list=document.getElementById('warReviewList');section.classList.remove('hidden');
 const all=data.allRows||data.mistakes||[],correct=all.filter(x=>x.isCorrect),wrong=all.filter(x=>!x.isCorrect);let active='all';
 document.getElementById('warReviewTitle').textContent=data.mode==='kanji'||sessionStorage.getItem('jft_war_kanji_review')?'Koreksi Kanji':'Koreksi Jawaban';
 summary.textContent=`${correct.length} benar • ${wrong.length} salah dari ${data.total||all.length} soal.`;
 document.getElementById('warShowCorrect').textContent=`Benar (${correct.length})`;document.getElementById('warShowWrong').textContent=`Salah (${wrong.length})`;
 function draw(){const rows=active==='correct'?correct:active==='wrong'?wrong:all;list.innerHTML=rows.length?rows.map((x,i)=>{const status=x.isCorrect?'<span class="inline-flex rounded-full bg-emerald-100 px-3 py-1 text-xs font-black text-emerald-800">BENAR ✓</span>':'<span class="inline-flex rounded-full bg-red-100 px-3 py-1 text-xs font-black text-red-800">SALAH ✕</span>';const heading=x.question||x.kanji||`Soal ${i+1}`;const optionMarkup=Array.isArray(x.options)?`<div class="mt-3 grid gap-2">${x.options.map((o,j)=>`<div class="rounded-lg border px-3 py-2 text-sm ${j===x.answerIndex?'border-emerald-400 bg-emerald-50 font-bold':''}">${'ABCD'[j]||j+1}. ${esc(o)}${j===x.answerIndex?' ✓':''}</div>`).join('')}</div>`:'';const meta=[x.kana,x.romaji,x.meaning,x.chapter?`Bab ${x.chapter}`:'',x.section].filter(Boolean).join(' • ');return `<article class="rounded-xl border-2 ${x.isCorrect?'border-emerald-200':'border-red-200'} p-4"><div class="text-lg font-black whitespace-pre-wrap" style="font-family:'Noto Sans JP',sans-serif">${esc(heading)}</div>${x.prompt?`<div class="text-sm text-slate-600 mt-2 whitespace-pre-wrap">${esc(x.prompt)}</div>`:'' }${meta?`<div class="text-sm text-slate-500 mt-1">${esc(meta)}</div>`:''}${optionMarkup}<div class="text-sm ${x.isCorrect?'text-emerald-700':'text-red-700'} mt-3">Jawabanmu: ${esc(x.selected||'Tidak dijawab')}</div><div class="text-sm font-bold text-emerald-700 mt-1">Jawaban benar: ${esc(x.answer||'—')}</div><div class="flex justify-end mt-4">${status}</div></article>`}).join(''):`<p class="rounded-xl bg-slate-50 p-4 font-bold text-slate-600">${active==='correct'?'Belum ada jawaban benar.':active==='wrong'?'Tidak ada jawaban salah. Bagus!':'Belum ada data jawaban.'}</p>`;
 ['warShowAll','warShowCorrect','warShowWrong'].forEach(id=>{const b=document.getElementById(id);b.classList.remove('bg-slate-900','text-white')});const activeId=active==='all'?'warShowAll':active==='correct'?'warShowCorrect':'warShowWrong';document.getElementById(activeId).classList.add('bg-slate-900','text-white');}
 document.getElementById('warShowAll').onclick=()=>{active='all';draw()};document.getElementById('warShowCorrect').onclick=()=>{active='correct';draw()};document.getElementById('warShowWrong').onclick=()=>{active='wrong';draw()};draw();
}
function renderRowsInto(list, rows){
 list.innerHTML=(rows||[]).map((x,i)=>{const ok=!!x.isCorrect;const title=x.question||x.kanji||`Soal ${i+1}`;const options=Array.isArray(x.options)?`<div class="mt-3 grid gap-2">${x.options.map((o,j)=>`<div class="rounded-lg border px-3 py-2 text-sm ${j===x.answerIndex?'border-emerald-400 bg-emerald-50 font-bold':''}">${'ABCD'[j]||j+1}. ${esc(o)}${j===x.answerIndex?' ✓':''}</div>`).join('')}</div>`:'';return `<article class="rounded-xl border-2 ${ok?'border-emerald-200':'border-red-200'} p-4"><div class="text-lg font-black whitespace-pre-wrap" style="font-family:'Noto Sans JP',sans-serif">${esc(title)}</div>${x.prompt?`<div class="text-sm text-slate-600 mt-2">${esc(x.prompt)}</div>`:''}<div class="text-sm ${ok?'text-emerald-700':'text-red-700'} mt-3">Jawaban pemain: ${esc(x.selected||'Tidak dijawab')}</div><div class="text-sm font-bold text-emerald-700 mt-1">Jawaban benar: ${esc(x.answer||'—')}</div>${options}<div class="flex justify-end mt-4"><span class="rounded-full px-3 py-1 text-xs font-black ${ok?'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-800'}">${ok?'BENAR ✓':'SALAH ✕'}</span></div></article>`}).join('')||'<p class="text-sm text-slate-500">Belum ada data koreksi.</p>';
}
async function renderTeamReview(){
 const section=document.getElementById('teamReview');const {data:players,error}=await sb.from('jft_war_players').select('id,player_name,status,review_data').eq('room_id',room.id).not('status','in','(kicked,left)');if(error||!players?.length)return;
 const ready=players.every(p=>p.status==='finished'&&p.review_data&&Array.isArray(p.review_data.allRows));
 section.classList.remove('hidden');const notice=document.getElementById('teamReviewNotice'),buttons=document.getElementById('teamReviewPlayers'),list=document.getElementById('teamReviewList');
 if(!ready){notice.textContent='Koreksi semua pemain akan terbuka setelah seluruh pemain menyelesaikan War.';buttons.innerHTML='';list.innerHTML='';return}
 notice.textContent='Semua pemain selesai. Pilih nama pemain untuk melihat soal, jawaban mereka, dan kunci jawaban.';let chosen=session.playerId;
 function draw(){buttons.innerHTML=players.map(p=>`<button data-player="${esc(p.id)}" class="rounded-lg border-2 px-3 py-2 text-sm font-bold ${p.id===chosen?'bg-slate-900 text-white border-slate-900':'border-slate-300'}">${esc(p.player_name)}</button>`).join('');buttons.querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=b.dataset.player;draw()});const p=players.find(x=>x.id===chosen);renderRowsInto(list,p?.review_data?.allRows||[])}draw();
}
function subscribe(){channel=sb.channel('jft-war-result-'+room.id+'-'+session.playerId);channel.on('postgres_changes',{event:'*',schema:'public',table:'jft_war_players',filter:'room_id=eq.'+room.id},render).subscribe()}
async function render(){const {data}=await sb.from('jft_war_players').select('*').eq('room_id',room.id).order('score',{ascending:false}).order('elapsed_seconds',{ascending:true});const el=document.getElementById('leaderboard');el.innerHTML=(data||[]).map((p,i)=>`<div class="flex items-center gap-3 p-3 rounded-xl border ${p.id===session.playerId?'border-slate-900 shadow-[3px_3px_0_#181818]':'border-slate-200'}"><div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-black">${i+1}</div><div class="flex-1 min-w-0"><div class="font-black truncate">${esc(p.player_name)} ${p.id===session.playerId?'<span class="text-[9px] text-slate-400">(KAMU)</span>':''}</div><div class="text-[10px] text-slate-500">${p.status==='finished'?'Selesai':'Masih mengerjakan'} • ${p.current_question||0}/${room.question_count} soal • ${fmt(p.elapsed_seconds||0)}</div></div><div class="text-right"><b class="text-lg">${p.score||0}</b><div class="text-[10px] font-black">Rank ${rank(Number(p.score||0))}</div></div></div>`).join('')||'<div class="text-sm text-slate-400">Belum ada pemain.</div>'}
init();
</script></body></html>
